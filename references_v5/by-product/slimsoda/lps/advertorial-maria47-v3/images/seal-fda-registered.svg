      <stop offset="0%" stop-color="#1a3a08"/>
      <stop offset="100%" stop-color="#0a1f04"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c9a96e"/>
