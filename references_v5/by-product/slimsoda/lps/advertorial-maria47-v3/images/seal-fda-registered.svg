    <text x="100" y="140" font-size="8" font-weight="600" letter-spacing="1.5">cGMP</text>
    <text x="100" y="154" font-size="8" font-weight="600" letter-spacing="1.5">CERTIFIED</text>
    <text x="100" y="168" font-size="7" letter-spacing="1.2" fill="#8a6d2c">SLIMSODA POWDER</text>
