  var sessionId = sessionStorage.getItem("imp_session_id");
  var lastActivity = parseInt(sessionStorage.getItem("imp_last_activity") || "0");
  var now = Date.now();
  if(!sessionId || (now - lastActivity) > 1800000){
    sessionId = crypto.randomUUID();
    sessionStorage.setItem("imp_session_id", sessionId);
  }
  sessionStorage.setItem("imp_last_activity", String(now));

  // UTMs
  var params = new URLSearchParams(window.location.search);

    opts = opts || {};

        "Content-Type": "application/json",
        "apikey": SB_KEY,

      body: JSON.stringify(data),

      utm_term: utms.utm_term || null,
      referrer: document.referrer || null,
      page_url: window.location.href,
      user_agent: navigator.userAgent

  }

  function trackEvent(eventName, eventData, eventId, opts){
    var eid = eventId || genEventId();
    if(window.fbq){
      try {
        // Map custom events to Meta standard events
        var mapping = META_EVENT_MAP[eventName];
        var payload = Object.assign({
          content_ids: ["slimsoda-3bottles"],
          content_name: "SlimSoda 2 Tubs (B1G1)",
          content_type: "product",
          currency: "USD"
        }, eventData || {});

          payload.value = (eventData && eventData.value) || mapping.value;
          window.fbq("track", mapping.type, payload, { eventID: eid });
        } else {
          // Pass value if provided in eventData
          if(mapping && eventData && !eventData.value) payload.value = mapping.value;
          window.fbq("trackCustom", eventName, payload, { eventID: eid });

      } catch(e){}

      id: eid,
      visitor_id: visitorId,
      session_id: sessionId,
      event_name: eventName,

      utm_content: utms.utm_content || null,
      utm_term: utms.utm_term || null,
      user_agent: navigator.userAgent
    }, opts);
  }

  // Map custom events to Meta standard events + values
  var META_EVENT_MAP = {
    "PageView":       { type: "PageView",       value: 0 },
    "ChatView":       { type: "ViewContent",    value: 5.00 },
    "AudioPlay":      { type: "custom",         value: 2.00 },

    "OfferView":      { type: "AddToCart",      value: 24.99 },
    "InitiateCheckout":{ type: "InitiateCheckout", value: 24.99 }
  };

  // Server-side CAPI: send same event with same eventID (Meta dedups)
  function sendCapi(eventName, eventData, eventId){
    if(!eventId) return;
    var meta = document.querySelector('meta[name="imp-pixel-id"]');
    var pixelId = meta ? meta.getAttribute("content") : null;
    if(!pixelId) return;
    var mapping = META_EVENT_MAP[eventName];
    var capiPayload = Object.assign({}, eventData || {}, {
      content_ids: ["slimsoda-3bottles"],
      content_name: "SlimSoda 2 Tubs (B1G1)",
      content_type: "product",
      currency: "USD"
    });
    if(mapping && !capiPayload.value) capiPayload.value = mapping.value;
    var capiEventName = (mapping && mapping.type !== "custom") ? mapping.type : eventName;
    try {
      fetch("/api/track-capi", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          pixel_id: pixelId,
          event_name: capiEventName,
          event_id: eventId,
          event_data: capiPayload,
          event_source_url: window.location.href
        }),
        keepalive: true
      }).catch(function(){});
    } catch(e){}
  }

  // Meta Pixel
  var pixelId = document.querySelector('meta[name="imp-pixel-id"]');
  if(pixelId){ pixelId = pixelId.getAttribute("content"); }
  if(pixelId){
    !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?

    t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,
    document,"script","https://connect.facebook.net/en_US/fbevents.js");
    fbq("init", pixelId);
    // PageView + ViewContent (product-level view)
    var pvEid = genEventId();
    fbq("track", "PageView", {}, { eventID: pvEid });
    sendCapi("PageView", { title: document.title, source: "chat-x1" }, pvEid);
    // ViewContent as the deeper "saw the product" signal
    var vcEid = genEventId();
    fbq("track", "ViewContent", {
      content_ids: ["slimsoda-3bottles"],
      content_name: "SlimSoda Chat LP",
      content_type: "product_group",
      value: 5.00,
      currency: "USD"
    }, { eventID: vcEid });
    sendCapi("ViewContent", { content_ids: ["slimsoda-3bottles"], value: 5.00, currency: "USD" }, vcEid);
  }

  trackEvent("ChatView", { title: document.title, source: "chat-x1" });

function addBotMessage(text, image){

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
}

function addAudioPlayer(src, label){
  const wrap = document.createElement("div");
  wrap.className = "msg dana";
  wrap.style.marginTop = "2px";
  wrap.innerHTML = `
    <div class="msg-avatar">D</div>
    <div class="audio-player" data-audio-src="${src}">
      <button class="audio-play-btn" aria-label="Play">▶</button>
      <div class="audio-wave">${'<div class="audio-wave-bar" style="height:10px"></div>'.repeat(12)}</div>
      <div class="audio-duration">${label || "0:00"}</div>
    </div>
  `;
  $messages.appendChild(wrap);
  scrollToBottom();
  const player = wrap.querySelector(".audio-player");
  const btn = player.querySelector(".audio-play-btn");
  const audio = new Audio(src);
  audio.preload = "metadata";
  audio.addEventListener("loadedmetadata", () => {
    const d = Math.round(audio.duration);
    const m = Math.floor(d/60);
    const s = String(d%60).padStart(2,"0");
    player.querySelector(".audio-duration").textContent = `${m}:${s}`;
  });
  player.addEventListener("click", () => {
    if(currentAudio && !currentAudio.paused){
      currentAudio.pause();
      currentAudio.currentTime = 0;
      document.querySelectorAll(".audio-player.playing").forEach(p => p.classList.remove("playing"));
      if(currentAudio === audio) return;
    }
    audio.play();
    player.classList.add("playing");
    currentAudio = audio;
    if(window.imptrack){
      window.imptrack.trackEvent("AudioPlay", { src: src, label: label, step: state.step });
    }
    audio.onended = () => { player.classList.remove("playing"); };
  });
  return audio;
}

/* ============================================================
   AUTO-ADVANCE (cinema mode: script runs if user doesn't type)
   ============================================================ */

let autoAdvanceTimer = null;
const AUTO_ADVANCE_MS = 9000; // 9 seconds of no input → advance

function clearAutoAdvance(){
  if(autoAdvanceTimer){
    clearTimeout(autoAdvanceTimer);
    autoAdvanceTimer = null;
  }
}

function scheduleAutoAdvance(nextNodeId, delay){
  clearAutoAdvance();
  if(!nextNodeId) return;
  autoAdvanceTimer = setTimeout(() => {
    autoAdvanceTimer = null;
    runNode(nextNodeId);
  }, delay || AUTO_ADVANCE_MS);
}

let lastFreeTextTurn = 0;
const MAX_FREE_TEXT_PER_SESSION = 2;

// Steps where the offer is imminent — only here do we fall back TO offer
const OFFER_OR_NEAR = new Set(["offer", "ask_anything", "end"]);

async function sendFreeText(text){
  const message = (text || $userInput.value).trim();
  if(!message) return;
  clearAutoAdvance(); // Cancel cinema mode if user types
  addUserMessage(message);
  $userInput.value = "";
  $sendBtn.disabled = true;
  if(window.imptrack){
    window.imptrack.trackEvent("ChatFreeText", { text: message.substring(0, 100), step: state.step });
  }
  // Rate limit free text turns
  if(lastFreeTextTurn >= MAX_FREE_TEXT_PER_SESSION){
    showTyping();
    setTimeout(() => {
      hideTyping();
      addBotMessage("I want to make sure I get this right. Let me show you the offer so you have all the details, then we can keep talking.");
      setTimeout(() => runNode("offer"), 1500);
    }, 900);
    return;
  }
  lastFreeTextTurn++;
  showTyping();
  const llmReply = await chatLlm(message);
  setTimeout(() => {
    hideTyping();
    if(llmReply){
      addBotMessage(llmReply);
      $sendBtn.disabled = false;
      // If LLM reply ends with next-step prompt, no auto-advance (LLM already handled it)
      // Otherwise continue from current step
      const currentStep = state.step;
      const next = SCRIPT[currentStep] && SCRIPT[currentStep].next;
      if(next) scheduleAutoAdvance(next, 5000);
      return;
    }
    // LLM failed — smart fallback (don't always jump to offer)
    const currentStep = state.step;
    const isGreeting = /^(hi|hello|hey|oi|olá|yo|hiya|howdy)\b/i.test(message);
    if(OFFER_OR_NEAR.has(currentStep)){
      // We're already at/near the offer — show it
      addBotMessage("I hear you. Let me show you the offer — that's the part that matters most.");
      setTimeout(() => runNode("offer"), 1500);
    } else if(isGreeting){
      // User just said hi — acknowledge warmly, then re-run the current step
      addBotMessage("Hey! I'm so glad you're here. Let me show you what I was about to say.");
      setTimeout(() => runNode(currentStep), 1200);
    } else {
      // Substantive input but LLM failed — continue the script from current step
      addBotMessage("I hear you. Let me keep going — I want to show you everything.");
      setTimeout(() => runNode(currentStep), 1200);
    }
  }, 900);
}

function toggleRecording(){
  if(isRecording){
    stopRecording();
  } else {
    startRecording();
  }
}

function startRecording(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){
    alert("Voice input not supported in this browser. Try Chrome or Edge.");
    return;
  }
  recognition = new SR();
  recognition.continuous = false;
  recognition.interimResults = true;
  recognition.lang = "en-US";
  let finalTranscript = "";
  recognition.onresult = (event) => {
    let interim = "";
    finalTranscript = "";
    for(let i = event.resultIndex; i < event.results.length; i++){
      const transcript = event.results[i][0].transcript;
      if(event.results[i].isFinal){
        finalTranscript += transcript;
      } else {
        interim += transcript;
      }
    }
    $userInput.value = finalTranscript + interim;
    $sendBtn.disabled = $userInput.value.trim().length === 0;
  };
  recognition.onend = () => {
    isRecording = false;
    $micBtn.classList.remove("recording");
    if(finalTranscript.trim()){
      sendFreeText(finalTranscript);
    }
  };
  recognition.onerror = (e) => {
    console.error("Speech error:", e.error);
    isRecording = false;
    $micBtn.classList.remove("recording");
    if(e.error === "not-allowed"){
      alert("Microphone access denied. Please allow microphone access and try again.");
    }
  };
  recognition.start();
  isRecording = true;
  $micBtn.classList.add("recording");
}

function stopRecording(){
  if(recognition){
    recognition.stop();
  }
}

      addUserMessage(r.label);
      // Save state if needed
      if(r.save && r.value){
        state[r.save] = r.value;
        if(window.imptrack){
          window.imptrack.trackEvent("ChatReply", { key: r.save, value: r.value, step: state.step });
        }
      } else {
        if(window.imptrack){
          window.imptrack.trackEvent("ChatReply", { key: r.label, step: state.step });
        }
      }
      // Go to next
      setTimeout(() => onClick(r.next), 800);
    });
    wrap.appendChild(btn);
  });
  clearInput();
  $input.appendChild(wrap);
}

function renderFreeInput(onSubmit){
  const wrap = document.createElement("div");
  wrap.className = "free-input";
  wrap.innerHTML = `
    <input type="text" placeholder="Type a question..." maxlength="300" autocomplete="off">
    <button>Send</button>
  `;
  const input = wrap.querySelector("input");
  const btn = wrap.querySelector("button");
  function send(){
    const t = input.value.trim();
    if(!t) return;
    addUserMessage(t);
    input.value = "";
    btn.disabled = true;
    if(window.imptrack){
      window.imptrack.trackEvent("ChatFreeText", { text: t.substring(0, 100), step: state.step });
    }
    onSubmit(t);
  }
  btn.addEventListener("click", send);
  input.addEventListener("keydown", e => { if(e.key === "Enter") send(); });
  clearInput();
  $input.appendChild(wrap);
  setTimeout(() => input.focus(), 100);
}

/* ============================================================
   FLOW RUNNER
   ============================================================ */

function runNode(nodeId){
  state.step++;
  // Special: personalized_hook
  if(nodeId === "personalized_hook"){
    SCRIPT.personalized_hook.text = getPersonalizedHook();
  }
  // Special: testimonial
  if(nodeId === "testimonial"){
    const t = getTestimonialForAge();
    SCRIPT.testimonial.audio = t.audio;
    SCRIPT.testimonial.text = t.text;
    SCRIPT.testimonial.image = t.image;
  }
  // Special: offer — text is already set in SCRIPT, no dynamic override needed
  const node = SCRIPT[nodeId];
  if(!node){ console.error("Unknown node:", nodeId); return; }

  const delay = node.delay || 800;
  showTyping();
  setTimeout(() => {
    hideTyping();
    // Audio first if present
    if(node.audio){
      const label = node.audio.startsWith("dana") ? "Dana" : "Voice";
      addAudioPlayer(`audio/${node.audio}.mp3`, label);
    }
    if(node.image){
      addBotMessage(null, node.image);
    }
    if(node.text){
      addBotMessage(node.text);
    }
    if(nodeId === "offer"){
      // Add the offer card as a separate bubble
      const wrap = document.createElement("div");
      wrap.className = "msg dana";
      wrap.innerHTML = `<div class="msg-avatar">D</div><div>${getOfferCardHtml()}</div>`;
      $messages.appendChild(wrap);
      scrollToBottom();
      // Track offer view
      if(window.imptrack){
        window.imptrack.trackEvent("OfferView", { step: state.step, age: state.age, frustration: state.frustration, glp1: state.glp1, weight: state.weight, value: 24.99 });
      }
    }
    scrollToBottom();
    // Quick replies are hidden via CSS. Auto-advance the script if user doesn't type.
    if(node.quickReplies && node.quickReplies.length > 0){
      // First quick reply is the default "happy path" advance
      const firstReply = node.quickReplies[0];
      if(firstReply.next){
        // Slightly longer delay for qualifying questions (let user read options mentally)
        const advanceDelay = firstReply.save ? 10000 : AUTO_ADVANCE_MS;
        scheduleAutoAdvance(firstReply.next, advanceDelay);
      }
    } else if(node.next){
      // Narrative nodes with no quickReplies — auto-advance after delay
      scheduleAutoAdvance(node.next);
    } else if(nodeId === "end"){
      clearAutoAdvance();
      clearInput();
    } else {
      clearAutoAdvance();
      clearInput();
    }
  }, delay);
}
