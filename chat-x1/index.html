/* ============================================================
   RENDER + STATE
   ============================================================ */

const $messages = document.getElementById("chat-messages");
const $input = document.getElementById("chat-input");
let currentAudio = null;

function scrollToBottom(){
  setTimeout(() => { $messages.scrollTop = $messages.scrollHeight; }, 50);
}

function showTyping(){
  const el = document.createElement("div");
  el.className = "typing";
  el.id = "typing-indicator";
  el.innerHTML = '<div class="msg-avatar" style="background:linear-gradient(135deg,#479C1A,#6BBA40);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;width:30px;height:30px;border-radius:50%;">D</div><div class="bubble"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>';
  $messages.appendChild(el);
  scrollToBottom();
}

function hideTyping(){
  const el = document.getElementById("typing-indicator");
  if(el) el.remove();
}

function addBotMessage(text, image){
  const wrap = document.createElement("div");
  wrap.className = "msg dana";
  let inner = '<div class="msg-avatar">D</div><div>';
  if(image){
    inner += `<div class="bubble bubble-image" style="padding:6px;"><img src="${image.src}" alt="" style="border-radius:12px;display:block;max-width:280px;width:100%;">${image.caption ? `<div class="bubble-image-caption">${image.caption}</div>` : ''}</div>`;
  }
  if(text){
    inner += `<div class="bubble">${text}</div>`;
  }
  inner += '</div>';
  wrap.innerHTML = inner;
  $messages.appendChild(wrap);
  scrollToBottom();
}

function addUserMessage(text){
  const wrap = document.createElement("div");
  wrap.className = "msg user";
  wrap.innerHTML = `<div class="msg-avatar">U</div><div class="bubble">${escapeHtml(text)}</div>`;
  $messages.appendChild(wrap);
  scrollToBottom();
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
}

function addAudioPlayer(src, label){
  const wrap = document.createElement("div");
  wrap.className = "msg dana";
  wrap.style.marginTop = "2px";
  wrap.innerHTML = `
    <div class="msg-avatar">D</div>
    <div class="audio-player" data-audio-src="${src}">
      <button class="audio-play-btn" aria-label="Play">▶</button>
      <div class="audio-wave">${'<div class="audio-wave-bar" style="height:10px"></div>'.repeat(12)}</div>
      <div class="audio-duration">${label || "0:00"}</div>
    </div>
  `;
  $messages.appendChild(wrap);
  scrollToBottom();
  const player = wrap.querySelector(".audio-player");
  const btn = player.querySelector(".audio-play-btn");
  const audio = new Audio(src);
  audio.preload = "metadata";
  audio.addEventListener("loadedmetadata", () => {
    const d = Math.round(audio.duration);
    const m = Math.floor(d/60);
    const s = String(d%60).padStart(2,"0");
    player.querySelector(".audio-duration").textContent = `${m}:${s}`;
  });
  player.addEventListener("click", () => {
    if(currentAudio && !currentAudio.paused){
      currentAudio.pause();
      currentAudio.currentTime = 0;
      document.querySelectorAll(".audio-player.playing").forEach(p => p.classList.remove("playing"));
      if(currentAudio === audio) return;
    }
    audio.play();
    player.classList.add("playing");
    currentAudio = audio;
    if(window.imptrack){
      window.imptrack.trackEvent("AudioPlay", { src: src, label: label, step: state.step });
    }
    audio.onended = () => { player.classList.remove("playing"); };
  });
  return audio;
}

function clearInput(){
  $input.innerHTML = "";
}

function renderQuickReplies(replies, onClick){
  if(!replies || replies.length === 0){
    clearInput();
    return;
  }
  const wrap = document.createElement("div");
  wrap.className = "quick-replies";
  replies.forEach(r => {
    const btn = document.createElement("button");
    btn.className = "quick-reply" + (r.primary ? " primary" : "");
    btn.textContent = r.label;
    btn.addEventListener("click", () => {
      // Disable all buttons after click
      wrap.querySelectorAll("button").forEach(b => b.disabled = true);
      // Add user message
      addUserMessage(r.label);
      // Save state if needed
      if(r.save && r.value){
        state[r.save] = r.value;
        if(window.imptrack){
          window.imptrack.trackEvent("ChatReply", { key: r.save, value: r.value, step: state.step });
        }
      } else {
        if(window.imptrack){
          window.imptrack.trackEvent("ChatReply", { key: r.label, step: state.step });
        }
      }
      // Go to next
      setTimeout(() => onClick(r.next), 800);
    });
    wrap.appendChild(btn);
  });
  clearInput();
  $input.appendChild(wrap);
}

function renderFreeInput(onSubmit){
  const wrap = document.createElement("div");
  wrap.className = "free-input";
  wrap.innerHTML = `
    <input type="text" placeholder="Type a question..." maxlength="300" autocomplete="off">
    <button>Send</button>
  `;
  const input = wrap.querySelector("input");
  const btn = wrap.querySelector("button");
  function send(){
    const t = input.value.trim();
    if(!t) return;
    addUserMessage(t);
    input.value = "";
    btn.disabled = true;
    if(window.imptrack){
      window.imptrack.trackEvent("ChatFreeText", { text: t.substring(0, 100), step: state.step });
    }
    onSubmit(t);
  }
  btn.addEventListener("click", send);
  input.addEventListener("keydown", e => { if(e.key === "Enter") send(); });
  clearInput();
  $input.appendChild(wrap);
  setTimeout(() => input.focus(), 100);
}

/* ============================================================
   FLOW RUNNER
   ============================================================ */

function runNode(nodeId){
  state.step++;
  // Special: personalized_hook
  if(nodeId === "personalized_hook"){
    SCRIPT.personalized_hook.text = getPersonalizedHook();
  }
  // Special: testimonial
  if(nodeId === "testimonial"){
    const t = getTestimonialForAge();
    SCRIPT.testimonial.audio = t.audio;
    SCRIPT.testimonial.text = t.text;
    SCRIPT.testimonial.image = t.image;
  }
  // Special: offer
  if(nodeId === "offer"){
    SCRIPT.offer.text = "I made this for women like you. <strong>Two tubs. Twenty-nine ninety-nine. The second one's free.</strong> Try it for 60 days — empty tub, money back. No risk on you. Just the change you've been waiting for.";
  }
  const node = SCRIPT[nodeId];
  if(!node){ console.error("Unknown node:", nodeId); return; }

  const delay = node.delay || 800;
  showTyping();
  setTimeout(() => {
    hideTyping();
    // Audio first if present
    if(node.audio){
      const label = node.audio.startsWith("dana") ? "Dana" : "Voice";
      addAudioPlayer(`audio/${node.audio}.mp3`, label);
    }
    if(node.image){
      addBotMessage(null, node.image);
    }
    if(node.text){
      addBotMessage(node.text);
    }
    if(nodeId === "offer"){
      // Add the offer card as a separate bubble
      const wrap = document.createElement("div");
      wrap.className = "msg dana";
      wrap.innerHTML = `<div class="msg-avatar">D</div><div>${getOfferCardHtml()}</div>`;
      $messages.appendChild(wrap);
      scrollToBottom();
      // Track offer view
      if(window.imptrack){
        window.imptrack.trackEvent("OfferView", { step: state.step, age: state.age, frustration: state.frustration, glp1: state.glp1, weight: state.weight, value: 29.99 });
      }
    }
    scrollToBottom();
    // Render input options
    if(node.showFreeInput){
      renderFreeInput(async (text) => {
        showTyping();
        const llmReply = await chatLlm(text);
        setTimeout(() => {
          hideTyping();
          if(llmReply){
            addBotMessage(llmReply);
          } else {
            addBotMessage("I hear you. Let me show you the offer — that's the part that matters most.");
          }
          scrollToBottom();
          setTimeout(() => runNode("offer"), 1200);
        }, 900);
      });
      // Also add quick reply below
      if(node.quickReplies){
        // Append quick replies to input area as second row
        const wrap = document.createElement("div");
        wrap.className = "quick-replies";
        node.quickReplies.forEach(r => {
          const btn = document.createElement("button");
          btn.className = "quick-reply" + (r.primary ? " primary" : "");
          btn.textContent = r.label;
          btn.addEventListener("click", () => {
            wrap.querySelectorAll("button").forEach(b => b.disabled = true);
            addUserMessage(r.label);
            setTimeout(() => runNode(r.next), 800);
          });
          wrap.appendChild(btn);
        });
        $input.appendChild(wrap);
      }
    } else if(node.quickReplies){
      renderQuickReplies(node.quickReplies, runNode);
    } else if(nodeId === "end"){
      clearInput();
    } else {
      clearInput();
    }
  }, delay);
}
